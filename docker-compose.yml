version: '3.8'

services:
  adtech-platform:
    build: .
    container_name: adtech-decisioning-attribution-platform
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=production
      - DECISION_TIMEOUT_MS=15
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
